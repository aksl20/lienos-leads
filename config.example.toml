# Copier en config.toml et adapter. Les secrets vont dans .env (voir .env.example).

db_path = "data/leads.sqlite"
recontact_cooldown_days = 90
# Fragments de noms à écarter (ESN qui sous-traitent en cascade, anciens employeurs…)
excluded_companies = []

[scoring]
model = "claude-haiku-5-5"
threshold = 70
threshold_levee = 55        # seuil propre aux levées de fonds (pas de mission à noter)
max_leads_per_run = 150
profile = """
Lienos (SASU, Axel) : consultant freelance senior en IA, 8+ ans de Python/IA.
Expertise : pathologie numérique, vision par ordinateur, Multiple Instance Learning,
self-supervised learning, Vision Transformers, pipelines multi-omics, apprentissage fédéré,
LLM/RAG mis en production. 3 publications dont npj Precision Oncology.
Offre : renfort ML senior, POC LLM/RAG en 4 à 6 semaines, audit data, formation.
TJM 700 €/jour. Basé au Kremlin-Bicêtre (Île-de-France), remote possible.
Cibles : startups/scale-ups IA-santé, PME/ETI sans équipe IA, missions freelance ML/LLM.
"""

[france_travail]
enabled = true
keywords = [
  "data scientist",
  "machine learning",
  "intelligence artificielle",
  "deep learning",
  "computer vision",
  "LLM",
  "MLOps",
]
departements = []           # ex. ["75", "92", "93", "94"] ; vide = toute la France
published_since_days = 1    # 1, 3, 7, 14 ou 31
max_results_per_keyword = 150

[rss]
enabled = true
# Un article est retenu s'il contient au moins un mot de chaque liste (mots entiers).
include_keywords = [        # signal de financement
  "lève", "lèvent", "levée", "levé", "millions", "seed", "série a", "series a",
  "série b", "series b", "tour de table",
]
topic_keywords = [          # thème ; liste vide = pas de filtre thématique
  "intelligence artificielle", "IA", "AI", "machine learning", "deep learning", "LLM",
  "santé", "medtech", "biotech", "healthtech", "pathologie", "diagnostic", "omics",
  "génomique", "imagerie", "data",
]

[rss.feeds]
maddyness = "https://www.maddyness.com/feed/"
frenchweb = "https://www.frenchweb.fr/feed"
# Recherches Google Actualités (sans compte) ; une alerte Google en mode « Flux RSS » marche aussi.
gnews_levee_ia_sante = "https://news.google.com/rss/search?q=%28l%C3%A8ve%20OR%20%22lev%C3%A9e%20de%20fonds%22%29%20%28%22intelligence%20artificielle%22%20OR%20IA%29%20%28sant%C3%A9%20OR%20medtech%20OR%20biotech%29%20when%3A7d&hl=fr&gl=FR&ceid=FR:fr"
gnews_levee_ia = "https://news.google.com/rss/search?q=startup%20%22l%C3%A8ve%22%20%22millions%22%20%28%22intelligence%20artificielle%22%20OR%20IA%29%20when%3A3d&hl=fr&gl=FR&ceid=FR:fr"

[malt_mail]
enabled = false             # activer après avoir branché les alertes Malt sur contact@lienos.fr
imap_host = "imap.zoho.eu"
mailbox = "INBOX"
sender_contains = "malt"
lookback_days = 2

[apify]
enabled = false             # relire les CGU de Free-Work avant d'activer
actor = "koatiromeo~french-it-contract-market"
min_daily_rate = 600        # comparé au haut de la fourchette ; les missions sans TJM sont gardées
queries = [                 # un run par mot-clé : l'acteur exige tous les mots d'une requête à la fois
  "machine learning",
  "data scientist",
  "LLM",
  "deep learning",
  "computer vision",
]
# Entrée de l'acteur (0,008 $ par mission livrée) : en mode incrémental, seules les nouvelles sont facturées
[apify.input]
sources = ["free-work"]
maxMissions = 50            # par mot-clé
sinceDays = 3
contractorOnly = true
onlyNewSinceLastRun = true
computeRateBenchmark = false  # sinon 0,10 $ par benchmark de TJM

[digest]
output_dir = "output"
send_email = false          # true une fois SMTP_USER / SMTP_PASSWORD renseignés
smtp_host = "smtp.zoho.eu"
smtp_port = 465
to = "contact@lienos.fr"
