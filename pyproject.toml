[project]
name = "lienos-leads"
version = "0.1.0"
description = "Veille et scoring automatiques de prospects pour l'activité freelance de Lienos"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "anthropic>=0.40",
    "feedparser>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
leads = "lienos_leads.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
